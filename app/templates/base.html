<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}NotebookLM Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="app-header">
    <a href="/" class="app-logo">NotebookLM Dashboard</a>
    <nav class="app-nav" aria-label="Main navigation">
      <a href="/dashboard" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a>
      <a href="/files" class="nav-link{% if active_page == 'files' %} active{% endif %}">File Browser</a>
      <a href="/prompts" class="nav-link{% if active_page == 'prompts' %} active{% endif %}">Prompts</a>
      <a href="/processing" class="nav-link{% if active_page == 'processing' %} active{% endif %}">Processing</a>
      <a href="/artifacts" class="nav-link{% if active_page == 'artifacts' %} active{% endif %}">Artifacts</a>
    </nav>
    <button id="logout-btn" class="btn btn-sm" hx-post="/api/auth/logout" hx-swap="none" hx-on::after-request="window.location='/'">Logout</button>
  </header>

  <main class="app-content" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/grid.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
