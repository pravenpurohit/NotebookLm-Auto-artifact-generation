<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login – NotebookLM Dashboard</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    /* Standalone login page styles (before styles.css is loaded) */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .login-card h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
    }
    .login-card p {
      margin: 0 0 1.5rem;
      color: #666;
      font-size: 0.95rem;
    }
    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #4285f4;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
      transition: background 0.15s;
    }
    .login-btn:hover { background: #3367d6; }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .error-area {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      color: #b91c1c;
      font-size: 0.9rem;
      display: none;
    }
    .error-area.visible { display: block; }
    .retry-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #4285f4;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0.5rem 0.75rem;
      min-height: 44px;
      min-width: 44px;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .login-btn.loading .spinner { display: inline-block; }
    .login-btn.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>NotebookLM Dashboard</h1>
    <p>Sign in with your Google account to get started.</p>

    <button
      class="login-btn"
      id="login-btn"
      type="button"
      aria-label="Sign in with Google"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M21.35 11.1h-9.18v2.73h5.51c-.24 1.27-.98 2.34-2.09 3.06l3.38 2.62c1.97-1.82 3.11-4.49 3.11-7.59 0-.57-.05-1.12-.14-1.64l-.59-.18z"/>
        <path fill="#fff" d="M12.17 22c2.84 0 5.22-.94 6.96-2.55l-3.38-2.62c-.94.63-2.15 1-3.58 1-2.75 0-5.08-1.86-5.91-4.36l-3.49 2.7C4.73 19.68 8.18 22 12.17 22z"/>
        <path fill="#fff" d="M6.26 13.47a6.52 6.52 0 0 1 0-4.14l-3.49-2.7a10.86 10.86 0 0 0 0 9.54l3.49-2.7z"/>
        <path fill="#fff" d="M12.17 5.83c1.55 0 2.94.53 4.04 1.58l3.02-3.02C17.38 2.73 15.01 1.8 12.17 1.8 8.18 1.8 4.73 4.12 2.77 7.63l3.49 2.7c.83-2.5 3.16-4.5 5.91-4.5z"/>
      </svg>
      <span class="btn-label">Sign in with Google</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <div class="error-area" id="error-area" role="alert" aria-live="polite">
      <span id="error-message"></span>
      <br>
      <button class="retry-link" id="retry-btn" type="button">Try again</button>
    </div>
  </div>

  <script>
    (function () {
      const loginBtn = document.getElementById('login-btn');
      const errorArea = document.getElementById('error-area');
      const errorMessage = document.getElementById('error-message');
      const retryBtn = document.getElementById('retry-btn');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorArea.classList.add('visible');
      }

      function hideError() {
        errorArea.classList.remove('visible');
      }

      function setLoading(loading) {
        if (loading) {
          loginBtn.classList.add('loading');
          loginBtn.disabled = true;
        } else {
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
        }
      }

      async function doLogin() {
        hideError();
        setLoading(true);

        try {
          const resp = await fetch('/api/auth/login', { method: 'POST' });
          const data = await resp.json();

          if (resp.ok && data.status === 'authenticated') {
            window.location.href = '/dashboard';
          } else {
            showError(data.detail || 'Authentication failed. Please try again.');
          }
        } catch (err) {
          showError('Unable to connect to the server. Check your network and try again.');
        } finally {
          setLoading(false);
        }
      }

      loginBtn.addEventListener('click', doLogin);
      retryBtn.addEventListener('click', doLogin);
    })();
  </script>
</body>
</html>
