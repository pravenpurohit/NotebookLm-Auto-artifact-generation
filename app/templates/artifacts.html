{% extends "base.html" %}

{% block title %}Artifacts – NotebookLM Dashboard{% endblock %}

{% block content %}
<section class="artifact-browser" aria-label="Artifact Browser">

  <!-- Error banner for remote fetch failures -->
  <div id="remote-error-banner" class="remote-error-banner" style="display:none;" role="alert">
    <span class="remote-error-msg"></span>
    <button class="btn-dismiss-banner" type="button" aria-label="Dismiss error">&times;</button>
  </div>

  <!-- Filter controls -->
  <div class="artifact-filters" role="search" aria-label="Artifact filters">
    <h2>Artifacts</h2>
    <form id="filter-form" class="filter-row">
      <label for="filter-location">Source Location
        <input type="text" id="filter-location" name="source_location" placeholder="e.g. /reports">
      </label>
      <label for="filter-filename">Source Filename
        <input type="text" id="filter-filename" name="source_filename" placeholder="e.g. report.pdf">
      </label>
      <label for="filter-type">Artifact Type
        <select id="filter-type" name="artifact_type" aria-label="Filter by artifact type">
          <option value="">All types</option>
          <option value="infographic">Infographic</option>
          <option value="audio">Audio</option>
          <option value="video">Video</option>
        </select>
      </label>
      <button class="btn btn-primary" type="submit">Apply</button>
      <button class="btn" type="button" id="btn-clear-filters">Clear</button>
    </form>
  </div>

  <!-- Artifact list -->
  <div class="artifact-list-wrapper">
    <table class="artifact-table" id="artifact-table" aria-label="Generated artifacts">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Type</th>
          <th scope="col">Source</th>
          <th scope="col">Created</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="artifact-tbody">
        <!-- rows rendered by JS -->
      </tbody>
    </table>
    <p class="empty-msg" id="empty-msg">No artifacts found.</p>
  </div>

  <!-- Inline preview panel -->
  <div class="artifact-preview" id="artifact-preview" style="display:none;" tabindex="-1" aria-live="polite">
    <div class="preview-header">
      <h3 id="preview-title"></h3>
      <button class="btn btn-sm" id="btn-close-preview" type="button" aria-label="Close preview">✕</button>
    </div>
    <div class="preview-content" id="preview-content"></div>
  </div>

  <!-- Screen reader announcements for dynamic updates (Finding 8.3) -->
  <div id="artifact-announcements" class="sr-only" aria-live="polite" role="status"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/js/artifacts.js"></script>
{% endblock %}
